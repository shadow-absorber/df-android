name: Release

# Builds the universal release APK for tagged releases (and manual runs).
# The tag must match versionName in app/build.gradle.kts; the check below enforces it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "r27"
  CARGO_NDK_VERSION: "4.1.2"
  APK: itmr-dragonfable-launcher-universal.apk
  # Must stay in sync with the sibling path dependencies in Cargo.toml.
  RUFFLE_REPO: itamar567/ruffle-df
  CACHE_REPO: itamar567/df-ruffle-cache-layer

jobs:
  build-native-libs:
    name: native libs (${{ matrix.android-abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - android-abi: arm64-v8a
            rust-target: aarch64-linux-android
          - android-abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
          - android-abi: x86_64
            rust-target: x86_64-linux-android
          - android-abi: x86
            rust-target: i686-linux-android

    steps:
      - name: Check out launcher
        uses: actions/checkout@v4
        with:
          path: android

      - name: Check out ruffle fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUFFLE_REPO }}
          path: ruffle
          # The ruffle fork is private
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - name: Check out cache layer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CACHE_REPO }}
          path: df-cache-layer

      - name: Install Rust toolchain
        # Inside the launcher dir so rust-toolchain.toml is honored and
        # the target lands on the pinned toolchain, not the default one.
        working-directory: android
        run: |
          rustup show
          rustup target add ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
          shared-key: ${{ matrix.rust-target }}
          save-if: ${{ github.ref_type == 'tag' }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk@${{ env.CARGO_NDK_VERSION }} --locked

      - name: Clean up NDKs
        run: |
          rm -r $ANDROID_NDK_HOME
          rm -r $ANDROID_NDK_LATEST_HOME

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Build native lib
        working-directory: android
        run: |
          unset ANDROID_SDK_ROOT # Deprecated, will cause an error if left set.
          cargo ndk --target ${{ matrix.android-abi }} --platform 26 -o jniLibs build --release --features jpegxr
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.android-abi }}
          path: android/jniLibs

  build-apk:
    name: Universal APK
    runs-on: ubuntu-latest
    needs: build-native-libs
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}

    steps:
      # Nested like the desktop workflow; ruffle/cache-layer are not needed
      # here because the cargo-ndk Gradle task is disabled on GHA.
      - name: Check out launcher
        uses: actions/checkout@v4
        with:
          path: android

      - uses: actions/download-artifact@v4
        with: # no name set, so all artifacts are downloaded
          path: native-libs

      - name: Copy native libs
        working-directory: android
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r ../native-libs/*/* app/src/main/jniLibs/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Caching needs to be disabled because of licensing, see:
          # https://github.com/gradle/actions#licensing-notice
          cache-disabled: true

      - name: Clean up NDKs
        run: |
          rm -r $ANDROID_NDK_HOME
          rm -r $ANDROID_NDK_LATEST_HOME

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: |
          version_name="$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*= "(.+)"/\1/')"
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app/build.gradle.kts versionName v${version_name}"
            exit 1
          fi

      - name: Decode keystore
        if: ${{ env.KEYSTORE != '' }}
        working-directory: android
        run: echo $KEYSTORE | base64 -di > app/androidkey.jks

      - name: Generate dummy keystore
        if: ${{ env.KEYSTORE == '' }}
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore app/androidkey.jks -alias dummy_alias \
            -storepass dummy_pass -keypass dummy_pass -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=example, OU=example, O=example, L=example, S=example, C=example"
          echo 'SIGNING_KEY_ALIAS=dummy_alias' >> $GITHUB_ENV
          echo 'SIGNING_STORE_PASSWORD=dummy_pass' >> $GITHUB_ENV
          echo 'SIGNING_KEY_PASSWORD=dummy_pass' >> $GITHUB_ENV

      - name: Build release APKs
        working-directory: android
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || env.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || env.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || env.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect universal APK
        working-directory: android
        run: mv app/build/outputs/apk/release/app-universal-release.apk "${{ github.workspace }}/${{ env.APK }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ github.workspace }}/${{ env.APK }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/') && needs.build-apk.result == 'success'

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
